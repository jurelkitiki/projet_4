<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion – LocaTech</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%228%22 fill=%22%230A84E8%22/%3E%3C/svg%3E">
</head>
<body>
<section class="bandeau">
  <div class="int">
    <h1>Connexion</h1>
    <p>Accédez à vos réservations, vos paiements et vos reçus.</p>
  </div>
</section>
<main>
  <div class="auth carte">
        <div id="erreur" class="erreur-form cache"></div>
    <form id="form">
      <div class="champ"><label for="email">Courriel</label><input type="email" id="email" name="email" required autocomplete="email"></div>
      <div class="champ"><label for="mdp">Mot de passe</label><input type="password" id="mdp" name="mot_de_passe" required autocomplete="current-password"></div>
      <button class="btn btn-bloc" type="submit">Se connecter</button>
    </form>
    <p>Pas encore de compte ? <a href="inscription.html">Créer un compte</a></p>
    <div class="comptes-test info">Comptes de démonstration (mot de passe <code>Motdepasse123!</code>) :<br>
      <code>client@location.test</code> · <code>responsable@location.test</code> · <code>admin@location.test</code></div>
  </div>
</main>
<script src="js/illustrations.js"></script>
<script src="js/app.js"></script>
<script src="js/connexion.js"></script>
</body>
</html>
