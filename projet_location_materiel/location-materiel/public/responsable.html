<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestion des locations – LocaTech</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%228%22 fill=%22%230A84E8%22/%3E%3C/svg%3E">
</head>
<body>
<section class="bandeau">
  <div class="int">
    <h1>Gestion des locations</h1>
    <p>Validez les demandes, enregistrez les remises et les retours, gérez les pénalités et l'état du matériel.</p>
  </div>
</section>
<main>
  <div class="onglets" id="onglets">
    <button data-onglet="attente" class="actif">Demandes en attente<span class="compte-onglet" data-n="attente"></span></button>
    <button data-onglet="remise">À remettre<span class="compte-onglet" data-n="remise"></span></button>
    <button data-onglet="cours">En cours / retours<span class="compte-onglet" data-n="cours"></span></button>
    <button data-onglet="annulations">Annulations<span class="compte-onglet" data-n="annulations"></span></button>
    <button data-onglet="penalites">Pénalités</button>
    <button data-onglet="materiel">État du matériel</button>
    <button data-onglet="toutes">Toutes</button>
  </div>
  <div class="carte"><div class="tableau-wrap" id="contenu"></div></div>
</main>
<script src="js/illustrations.js"></script>
<script src="js/app.js"></script>
<script src="js/detail.js"></script>
<script src="js/responsable.js"></script>
</body>
</html>
