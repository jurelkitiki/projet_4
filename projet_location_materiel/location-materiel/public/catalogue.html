<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catalogue de location – LocaTech</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%228%22 fill=%22%230A84E8%22/%3E%3C/svg%3E">
</head>
<body>
<section class="bandeau">
  <div class="int">
    <div class="fil"><a href="index.html">Accueil</a> › <span id="fil-cat">Catalogue de location</span></div>
    <h1>Catalogue de location</h1>
    <p>Choisissez vos dates pour voir les quantités disponibles, puis ajoutez le matériel à votre panier.</p>
  </div>
</section>
<main>
  <div class="cat-grille">
    <aside class="cat-filtres">
      <h4>Catégories</h4>
      <div id="liste-cats"></div>
      <form class="f-dates" id="f-dates">
        <h4 style="margin:0">Période</h4>
        <label>Début<input type="date" name="debut" id="debut"></label>
        <label>Fin<input type="date" name="fin" id="fin"></label>
        <button class="btn btn-bleu">Mettre à jour</button>
      </form>
    </aside>
    <div>
      <input class="cat-recherche" id="recherche" type="search" placeholder="Rechercher : portable, projecteur, HDMI…" aria-label="Rechercher un équipement">
      <div class="periode neutre" id="periode">Choisissez une période pour afficher les quantités disponibles.</div>
      <div class="prods" id="liste"></div>
    </div>
  </div>
</main>
<script src="js/illustrations.js"></script>
<script src="js/app.js"></script>
<script src="js/catalogue.js"></script>
</body>
</html>
