<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Créer un compte – LocaTech</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%228%22 fill=%22%230A84E8%22/%3E%3C/svg%3E">
</head>
<body>
<section class="bandeau">
  <div class="int">
    <h1>Créer un compte</h1>
    <p>Inscrivez-vous gratuitement pour louer du matériel.</p>
  </div>
</section>
<main>
  <div class="auth carte">
        <div id="erreur" class="erreur-form cache"></div>
    <form id="form">
      <div class="champs">
        <div class="champ"><label for="prenom">Prénom</label><input id="prenom" name="prenom" required maxlength="80"></div>
        <div class="champ"><label for="nom">Nom</label><input id="nom" name="nom" required maxlength="80"></div>
      </div>
      <div class="champ"><label for="email">Courriel</label><input type="email" id="email" name="email" required></div>
      <div class="champ"><label for="tel">Téléphone (facultatif)</label><input id="tel" name="telephone" maxlength="30"></div>
      <div class="champ"><label for="mdp">Mot de passe</label><input type="password" id="mdp" name="mot_de_passe" required minlength="8" autocomplete="new-password">
        <small>8 caractères minimum, dont au moins un chiffre.</small></div>
      <div class="champ"><label for="mdp2">Confirmer le mot de passe</label><input type="password" id="mdp2" name="confirmation" required autocomplete="new-password"></div>
      <button class="btn btn-bloc" type="submit">Créer mon compte</button>
    </form>
    <p>Déjà inscrit ? <a href="connexion.html">Se connecter</a></p>
  </div>
</main>
<script src="js/illustrations.js"></script>
<script src="js/app.js"></script>
<script src="js/inscription.js"></script>
</body>
</html>
