<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panier – LocaTech</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%228%22 fill=%22%230A84E8%22/%3E%3C/svg%3E">
</head>
<body>
<section class="bandeau">
  <div class="int">
    <h1>Mon panier</h1>
    <p>Vérifiez la période, les quantités et le coût total avant d'envoyer votre demande.</p>
  </div>
</section>
<main>
  <div class="deux-col">
    <div class="carte">
      <div class="champs">
        <div class="champ"><label for="debut">Date de début</label><input type="date" id="debut"></div>
        <div class="champ"><label for="fin">Date de fin</label><input type="date" id="fin"></div>
      </div>
      <div id="articles"></div>
    </div>
    <aside class="carte resume" id="resume"></aside>
  </div>
</main>
<script src="js/illustrations.js"></script>
<script src="js/app.js"></script>
<script src="js/panier.js"></script>
</body>
</html>
