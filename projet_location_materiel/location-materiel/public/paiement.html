<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paiement – LocaTech</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%228%22 fill=%22%230A84E8%22/%3E%3C/svg%3E">
</head>
<body>
<section class="bandeau">
  <div class="int">
    <h1 id="titre">Paiement</h1>
    <p>Environnement de simulation : aucune transaction bancaire réelle, aucune donnée de carte enregistrée.</p>
  </div>
</section>
<main>
  <div class="deux-col">
    <div class="carte" id="recap"></div>
    <aside class="carte">
      <h2>Carte (simulation)</h2>
      <div id="erreur" class="erreur-form cache"></div>
      <form id="form" autocomplete="off">
        <div class="champ"><label for="titulaire">Titulaire</label><input id="titulaire" name="titulaire" required></div>
        <div class="champ"><label for="numero">Numéro de carte</label><input id="numero" name="numero_carte" inputmode="numeric" placeholder="4242 4242 4242 4242" required maxlength="19"></div>
        <div class="champs">
          <div class="champ"><label for="exp">Expiration</label><input id="exp" name="expiration" placeholder="MM/AA" required maxlength="5"></div>
          <div class="champ"><label for="cvv">CVV</label><input id="cvv" name="cvv" inputmode="numeric" required maxlength="4"></div>
        </div>
        <div class="total"><span>À payer</span><span id="a-payer">—</span></div>
        <button class="btn btn-succes btn-bloc" type="submit" style="margin-top:1rem">Payer</button>
      </form>
      <div class="info" style="margin-top:1rem;font-size:.85rem">Cartes de test :<br>
        <code>4242 4242 4242 4242</code> → acceptée<br><code>4000 0000 0000 0002</code> → refusée<br>Expiration future, CVV quelconque.</div>
      <p id="delai" class="avertissement cache" style="margin-top:1rem"></p>
    </aside>
  </div>
</main>
<script src="js/illustrations.js"></script>
<script src="js/app.js"></script>
<script src="js/paiement.js"></script>
</body>
</html>
